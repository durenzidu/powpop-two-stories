name: check-locales

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The Chinese SKILL.md is canonical. Every locale must match it on version,
      # tool names, hard numbers, rule count, and section count.
      - name: Locale parity
        run: node scripts/check-locales.mjs
